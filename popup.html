<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Monitor de Peticiones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-title">
      <h2>Inspector de Red</h2>
      <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" title="Configurar traducciones de eventos">⚙️</button>
        <span id="counter" class="badge">0</span>
      </div>
    </div>
    <div class="controls">
      <input 
        type="text" 
        id="targetFilter" 
        placeholder="Filtrar por URL / endpoint (ej: analytics, /collect, api/v1)..."
      />
      <div class="actions">
        <label class="toggle-label">
          <input type="checkbox" id="currentTabOnly" checked> Pestaña activa
        </label>
        <button id="clearBtn" title="Limpiar registros">Limpiar</button>
      </div>
    </div>
  </header>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-header">
      <h3>Traducciones de eventos</h3>
      <button id="closeSettingsBtn" class="icon-btn" title="Cerrar">✕</button>
    </div>
    <div id="translationList" class="translation-list"></div>
    <form id="translationForm" class="translation-form">
      <input type="text" id="newDomain" placeholder="Dominio (ej: criteo, * para todos)" list="domainPresets" required />
      <datalist id="domainPresets">
        <option value="criteo"></option>
        <option value="*"></option>
      </datalist>
      <input type="text" id="newCode" placeholder="Código evento (ej: vpg)" required />
      <input type="text" id="newLabel" placeholder="Traducción (ej: View page)" required />
      <button type="submit">Agregar</button>
    </form>
  </div>

  <main>
    <div id="requestList" class="request-list">
      <div class="empty-state">No se han registrado peticiones que coincidan con el filtro.</div>
    </div>
  </main>

  <script src="event-translations.js"></script>
  <script src="popup.js"></script>
</body>
</html>
